<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home Dashboard</title>

<style type="text/css">

body {
    margin: 0;
    padding: 20px;
    background: #101722;
    color: #e7edf5;
    font-family: Arial, Helvetica, sans-serif;
}

.header {
    color: #8498ae;
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.clock {
    text-align: center;
    font-size: 95px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-top: 5px;
}

.date {
    text-align: center;
    font-size: 24px;
    color: #b8c6d8;
    margin-top: 5px;
}

.location {
    text-align: center;
    color: #8498ae;
    font-size: 13px;
    letter-spacing: 3px;
    margin-top: 10px;
}

.line {
    height: 1px;
    background: #344253;
    margin: 22px 0;
}

.panels {
    display: table;
    width: 100%;
    table-layout: fixed;
}

.panel {
    display: table-cell;
    width: 50%;
    vertical-align: top;
    padding: 10px 20px;
}

.panel-title {
    color: #91a5bb;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.temperature {
    font-size: 65px;
    font-weight: bold;
}

.description {
    color: #aab9ca;
    font-size: 17px;
    margin-top: 5px;
}

.sun-row {
    font-size: 24px;
    margin: 12px 0;
}

.sun-label {
    display: inline-block;
    width: 125px;
    color: #aab9ca;
}

.sun-value {
    color: #f1c36d;
}

.calendar-title {
    font-size: 24px;
    margin-bottom: 12px;
}

.calendar {
    width: 100%;
    border-collapse: separate;
    border-spacing: 5px;
    text-align: center;
    table-layout: fixed;
}

.calendar th {
    color: #8498ae;
    font-size: 13px;
    padding: 6px 0;
}

.calendar td {
    background: #1c2938;
    border-radius: 5px;
    height: 38px;
    font-size: 17px;
}

.calendar td.today {
    background: #d49a45;
    color: #101722;
    font-weight: bold;
}

.calendar td.empty {
    background: transparent;
}

.footer {
    text-align: center;
    color: #65788e;
    font-size: 12px;
    margin-top: 25px;
}

</style>
</head>

<body>

<div class="header">HOME DASHBOARD</div>

<div class="clock" id="clock">--:--</div>

<div class="date" id="date">
Loading...
</div>

<div class="location">
ZAGREB · CROATIA
</div>

<div class="line"></div>

<div class="panels">

    <div class="panel">

        <div class="panel-title">
        WEATHER
        </div>

        <div class="temperature" id="temperature">
        --°
        </div>

        <div class="description" id="description">
        Loading weather...
        </div>

    </div>

    <div class="panel">

        <div class="panel-title">
        SUNRISE & SUNSET
        </div>

        <div class="sun-row">
            <span class="sun-label">Sunrise</span>
            <span class="sun-value" id="sunrise">--:--</span>
        </div>

        <div class="sun-row">
            <span class="sun-label">Sunset</span>
            <span class="sun-value" id="sunset">--:--</span>
        </div>

    </div>

</div>

<div class="line"></div>

<div class="calendar-title" id="monthTitle">
Calendar
</div>

<table class="calendar">

    <thead>
        <tr>
            <th>MON</th>
            <th>TUE</th>
            <th>WED</th>
            <th>THU</th>
            <th>FRI</th>
            <th>SAT</th>
            <th>SUN</th>
        </tr>
    </thead>

    <tbody id="calendarBody">
    </tbody>

</table>

<div class="footer">
HOME DASHBOARD · ZAGREB
</div>

<script type="text/javascript">

var days = [
    "Nedjelja",
    "Ponedjeljak",
    "Utorak",
    "Srijeda",
    "Četvrtak",
    "Petak",
    "Subota"
];

var months = [
    "siječnja",
    "veljače",
    "ožujka",
    "travnja",
    "svibnja",
    "lipnja",
    "srpnja",
    "kolovoza",
    "rujna",
    "listopada",
    "studenoga",
    "prosinca"
];

var monthNames = [
    "Siječanj",
    "Veljača",
    "Ožujak",
    "Travanj",
    "Svibanj",
    "Lipanj",
    "Srpanj",
    "Kolovoz",
    "Rujan",
    "Listopad",
    "Studeni",
    "Prosinac"
];

function updateClock() {

    var now = new Date();

    var h = now.getHours();
    var m = now.getMinutes();

    document.getElementById("clock").innerHTML =
        (h < 10 ? "0" : "") + h + ":" +
        (m < 10 ? "0" : "") + m;

    document.getElementById("date").innerHTML =
        days[now.getDay()] + ", " +
        now.getDate() + ". " +
        months[now.getMonth()] + " " +
        now.getFullYear();

}

function drawCalendar() {

    var now = new Date();

    var year = now.getFullYear();
    var month = now.getMonth();
    var today = now.getDate();

    document.getElementById("monthTitle").innerHTML =
        monthNames[month] + " " + year;

    var firstDay =
        new Date(year, month, 1).getDay();

    var daysInMonth =
        new Date(year, month + 1, 0).getDate();

    var offset = (firstDay + 6) % 7;

    var html = "";
    var day = 1;

    for (var row = 0; row < 6; row++) {

        html += "<tr>";

        for (var col = 0; col < 7; col++) {

            if ((row === 0 && col < offset) ||
                day > daysInMonth) {

                html += '<td class="empty"></td>';

            } else {

                var cls =
                    (day === today) ? "today" : "";

                html += '<td class="' +
                    cls + '">' + day + '</td>';

                day++;
            }
        }

        html += "</tr>";

        if (day > daysInMonth) {
            break;
        }
    }

    document.getElementById("calendarBody").innerHTML =
        html;
}

function weatherDescription(code) {

    if (code === 0) return "Vedro";
    if (code <= 3) return "Djelomično oblačno";
    if (code <= 48) return "Magla";
    if (code <= 67) return "Kiša";
    if (code <= 77) return "Snijeg";
    if (code <= 82) return "Pljuskovi";
    if (code <= 86) return "Snježni pljuskovi";
    if (code >= 95) return "Grmljavina";

    return "Promjenjivo vrijeme";
}

function loadWeather() {

    var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=45.8150" +
        "&longitude=15.9819" +
        "&current=temperature_2m,weather_code" +
        "&daily=sunrise,sunset" +
        "&timezone=Europe%2FZagreb";

    var xhr = new XMLHttpRequest();

    xhr.open("GET", url, true);

    xhr.onreadystatechange = function() {

        if (xhr.readyState === 4) {

            if (xhr.status === 200) {

                try {

                    var data =
                        JSON.parse(xhr.responseText);

                    document.getElementById(
                        "temperature"
                    ).innerHTML =
                        Math.round(
                            data.current.temperature_2m
                        ) + "°";

                    document.getElementById(
                        "description"
                    ).innerHTML =
                        weatherDescription(
                            data.current.weather_code
                        );

                    document.getElementById(
                        "sunrise"
                    ).innerHTML =
                        data.daily.sunrise[0].substring(11, 16);

                    document.getElementById(
                        "sunset"
                    ).innerHTML =
                        data.daily.sunset[0].substring(11, 16);

                } catch(e) {

                    document.getElementById(
                        "description"
                    ).innerHTML =
                        "Weather unavailable";

                }

            } else {

                document.getElementById(
                    "description"
                ).innerHTML =
                    "Weather unavailable";

            }
        }
    };

    xhr.send();
}

updateClock();
drawCalendar();
loadWeather();

setInterval(updateClock, 1000);
setInterval(drawCalendar, 60000);
setInterval(loadWeather, 1800000);

</script>

</body>
</html>
